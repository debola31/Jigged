# Production deploys wait for the database.
#
# ═══════════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS
# ═══════════════════════════════════════════════════════════════════════════════
# Merging to main used to start two things at once, with no ordering between them:
# Supabase applied the migrations, and Vercel built and shipped the frontend.
# Neither waited for the other, so when one failed the other shipped anyway.
#
# On 2026-08-01 a migration failed to apply to production. Vercel deployed the
# frontend regardless. Two days later PR #654 shipped code selecting
# customer_contacts.is_billing_default — a column the failed migration was
# supposed to create — and every job and quote page in production started
# rendering "Job not found" (PostgREST 42703 rejects the whole select).
#
# The migration failing was survivable. Shipping code that depended on it was not.
# This workflow makes the frontend deploy WAIT for the database, and refuse to
# ship if the database did not get what the code expects.
#
# ═══════════════════════════════════════════════════════════════════════════════
# THE SIGNAL WE GATE ON, AND WHY IT IS NOT A NEW ONE
# ═══════════════════════════════════════════════════════════════════════════════
# Supabase already reports the production apply: it posts a check run onto the
# MERGE COMMIT once it has run the migrations against production. During the
# outage that check said `failure` on five consecutive merges over two days, with
# the exact SQL error in its summary. Nobody saw it, for two structural reasons:
#
#   1. It lands on the merge commit, which is created AFTER the PR page freezes.
#      A closed PR never updates, so the PR stays green forever.
#   2. It is a check run from a third-party GitHub App, and GitHub sends no
#      notification for those — the failure emails you can subscribe to cover
#      Actions workflows only, and only for the user who triggered them
#      (github.com/orgs/community/discussions/55379, still open).
#
# So the fix is not another probe. It is to READ the verdict that already exists
# and refuse to deploy on top of it. An earlier attempt polled production's
# schema_migrations table over a direct database connection; that meant a prod DB
# credential in CI and a second source of truth that could disagree with the
# first. This asks Supabase what happened instead.
#
# It also fixes the notification gap as a side effect, which is the real reason
# to prefer it: THIS is an Actions workflow, so when it fails GitHub emails the
# person who merged. No mail provider, no API key, no extra moving parts.

name: Deploy Production

on:
  push:
    branches: [main]
  # Manual re-run, for shipping after a migration has been fixed without waiting
  # for another merge — and the escape hatch if Actions itself is the problem.
  workflow_dispatch:

# Deploys queue; they never cancel each other. cancel-in-progress would kill a
# deploy midway through `vercel deploy`, which is the one moment where being
# interrupted can leave production in an indeterminate state. Two rapid merges
# simply deploy in order, and the later one wins because it runs last.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # EVERY check that must be green before production ships. One per line, matched
  # against the check-run name exactly as the API reports it — which is the BARE
  # name, without the "Tests / " workflow prefix the GitHub UI displays. Copy them
  # from:
  #
  #     gh api repos/OWNER/REPO/commits/SHA/check-runs --jq '.check_runs[].name'
  #
  # "Supabase Preview" is confusingly named: on a merge commit it reports the
  # PRODUCTION migration apply, not a preview branch.
  #
  # This job's OWN checks are deliberately absent. Listing "Database is ready for
  # this code" here would make the gate wait for itself and time out every run.
  REQUIRED_CHECKS: |
    Supabase Preview
    Backend Tests
    Frontend Tests
    Playwright E2E (local Supabase)
  # Long enough for the slowest of them. Playwright runs ~9 minutes, so the old
  # 600s — sized when this waited on Supabase alone (~38s) — would have timed out
  # on a healthy build and blocked the deploy. Fifteen minutes of headroom is
  # cheap; a false "no verdict" is not.
  GATE_TIMEOUT_SECONDS: 1500

jobs:
  gate:
    name: Checks passed and database is ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for every required check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Commit ${GITHUB_SHA:0:8} — waiting for:"
          printf '%s\n' "$REQUIRED_CHECKS" | sed '/^[[:space:]]*$/d;s/^/  - /'
          DEADLINE=$(( SECONDS + GATE_TIMEOUT_SECONDS ))

          # Newest run of a given check name. A re-run after a fix must supersede
          # the original failure rather than be masked by it.
          NEWEST='[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last'

          while :; do
            # One API call per poll, reused for every check below. Fetching per
            # check would multiply requests by the number of gates and read a
            # slightly different moment for each.
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --paginate \
                   | jq -s '{check_runs: (map(.check_runs) | add)}')

            WAITING=""
            FAILED=""

            while IFS= read -r NAME; do
              [ -z "${NAME// }" ] && continue

              # Status and conclusion ONLY — deliberately never .output.summary.
              # Supabase puts a raw multi-line SQL error there, so folding it into
              # this delimited row makes it many lines and every field parsed out
              # is garbage. That misreads a genuine FAILURE as a timeout, which is
              # the most dangerous confusion available here.
              STATE=$(printf '%s' "$RUNS" | jq -r --arg n "$NAME" \
                "$NEWEST | if . == null then \"absent|\" else \"\(.status)|\(.conclusion // \"\")\" end")

              STATUS="${STATE%%|*}"
              CONCLUSION="${STATE#*|}"

              if [ "$STATUS" != "completed" ]; then
                # `absent` counts as waiting, not missing: a check that has not been
                # created yet is indistinguishable from one about to be, and
                # treating it as absent-forever would deploy before it ever ran.
                WAITING="${WAITING}    ${NAME} (${STATUS})"$'\n'
              elif [ "$CONCLUSION" != "success" ]; then
                FAILED="${FAILED}    ${NAME} → ${CONCLUSION}"$'\n'
              fi
            done <<< "$REQUIRED_CHECKS"

            # A failure is final — nothing the remaining checks report can make
            # this commit shippable, so stop rather than wait out the timeout.
            if [ -n "$FAILED" ]; then
              echo "::error::Required checks failed on this commit; production was not deployed."
              printf '%s' "$FAILED"
              {
                echo "## Production deploy blocked — required checks failed"
                echo
                echo '```'
                printf '%s' "$FAILED"
                echo '```'
                echo
                echo "Production is still serving the previous build."
                echo
                echo "If the failure is \`Supabase Preview\`, the migration did not reach"
                echo "production — open that check for the SQL error, fix the migration and"
                echo "merge again. Never clear it with \`migration repair --status applied\`,"
                echo "which records the file as done without running it."
                echo
                echo "If it is a test job, main is broken: fix forward or revert. Re-run this"
                echo "workflow once the checks are green to ship without another merge."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ -z "$WAITING" ]; then
              echo "✅ Every required check passed. Safe to deploy."
              exit 0
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              # FAIL CLOSED. No verdict is not a good verdict, and shipping code
              # whose tests and schema are unverified is the failure this exists to
              # prevent. The cost is that a stuck check blocks the deploy; re-run
              # this workflow once it reports.
              echo "::error::Still waiting after ${GATE_TIMEOUT_SECONDS}s; production was not deployed."
              printf '%s' "$WAITING"
              {
                echo "## Production deploy blocked — checks never reported"
                echo
                echo "Still incomplete after ${GATE_TIMEOUT_SECONDS}s:"
                echo '```'
                printf '%s' "$WAITING"
                echo '```'
                echo
                echo "This gate fails closed on purpose. A check stuck in \`queued\` is"
                echo "usually a runner backlog — re-run this workflow once it reports."
                echo
                echo "A check stuck at \`absent\` instead means it never started, so the"
                echo "name in \`REQUIRED_CHECKS\` may no longer match what the workflow"
                echo "posts. Compare against:"
                echo '```'
                echo "gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs --jq '.check_runs[].name'"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "waiting (${SECONDS}s):"
            printf '%s' "$WAITING"
            sleep 15
          done

  deploy:
    name: Trigger the Vercel production deploy
    needs: gate
    runs-on: ubuntu-latest
    steps:
      # A deploy HOOK, not a CLI build-and-deploy. Vercel builds this exactly as
      # it does for a git push; all this workflow decides is WHEN that starts.
      #
      # The CLI path was tried first and abandoned after three separate walls, all
      # of them structural rather than misconfiguration:
      #
      #   1. `vercel build` expands vercel.json's `functions: { "api/**" }` glob
      #      into one function per matched Python file — 82 of them, against a
      #      12-function cap on Hobby. It also installed dependencies 82 times,
      #      which is why the build took 21 minutes.
      #   2. Narrowing that glob to the real entrypoint `api/index.py` gives one
      #      function of 244 MB, against a 225 MB cap. The bulk is the dependency
      #      stack (three LLM SDKs, Stripe, Sentry, two Postgres drivers), so
      #      excluding repo files from the bundle changed the size by nothing.
      #   3. Building on a runner has no Vercel build cache, so even a working
      #      version would have traded a ~3 minute deploy for a ~30 minute one.
      #
      # Vercel's own builder hits none of these, and has been deploying this app
      # all along. Handing the build back to it keeps every one of those problems
      # solved and leaves this workflow responsible only for ordering.
      #
      # WHAT THIS STEP DOES AND DOES NOT PROVE. It proves Vercel ACCEPTED the
      # trigger, not that the deployment succeeded — completion is reported by
      # Vercel, not here. That is a deliberate limit rather than an oversight: a
      # build failing after this point leaves production serving the PREVIOUS
      # code against a database that has already migrated, which is the safe
      # direction (old code, new schema) and the one additive migrations are
      # written to survive. The dangerous ordering — new code, old schema — is
      # what the gate above already refuses.
      - name: Trigger the deploy
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -uo pipefail

          if [ -z "${HOOK_URL:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set — production was not deployed."
            {
              echo "## Production not deployed — no hook configured"
              echo
              echo "The migration gate passed, so the database is ready, but the"
              echo "deploy was never triggered. Production is still serving the"
              echo "previous build."
              echo
              echo "Create the hook with:"
              echo '```'
              echo "vercel deploy-hooks create gated-prod-deploy --ref main"
              echo '```'
              echo "then store its URL as the \`VERCEL_DEPLOY_HOOK_URL\` secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # -o/-w rather than a bare curl: the response body is written to a file
          # so nothing that might echo the URL reaches the log, and only the job
          # id is printed back.
          HTTP=$(curl -sS -X POST -o /tmp/hook-response.json -w '%{http_code}' "$HOOK_URL") || true

          case "${HTTP:-000}" in
            200|201)
              JOB=$(jq -r '.job.id // "unknown"' /tmp/hook-response.json 2>/dev/null || echo unknown)
              echo "✅ Vercel accepted the deploy trigger (job ${JOB})."
              {
                echo "## Deploy triggered"
                echo
                echo "The migration gate passed and Vercel accepted the trigger"
                echo "(job \`${JOB}\`). Vercel builds and reports the outcome —"
                echo "this workflow does not wait for it."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Vercel rejected the deploy trigger (HTTP ${HTTP:-000})."
              {
                echo "## Production not deployed — Vercel rejected the trigger"
                echo
                echo "HTTP \`${HTTP:-000}\`. The database has migrated but the new"
                echo "code was not shipped, so production is serving the previous"
                echo "build against the new schema."
                echo
                echo "Most likely the hook was deleted or regenerated in Vercel."
                echo "List them with \`vercel deploy-hooks list\` and update the"
                echo "\`VERCEL_DEPLOY_HOOK_URL\` secret."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
