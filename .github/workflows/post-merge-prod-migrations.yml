# Does production actually have what main says it has?
#
# Nothing else in this repo answers that. Every other gate — `supabase db reset`
# locally, the Supabase Preview check on a PR, the E2E stack — runs against a
# database built by REPLAYING the migrations, so all of them are green by
# construction whenever the migration files are internally consistent. None of
# them touches production.
#
# On 2026-08-01 a migration failed to apply to production and no check noticed.
# Merges kept going green for two days while the deployed frontend queried
# columns the production database did not have, until every job and quote page
# rendered "Job not found". The bad statement was cheap to fix; the SILENCE cost
# two days. This workflow is that missing alarm.
#
# It deliberately does NOT apply anything. Supabase Branching owns the apply on
# merge (CLAUDE.md: never `db push` to prod by hand). This only asks whether the
# apply happened, and makes it loud when it did not.

name: Prod Migrations

on:
  push:
    branches: [main]
  # Manual re-check, for confirming a fix without waiting for the next merge.
  workflow_dispatch:

# Deliberately NOT triggered on pull_request. A PR that adds a migration has,
# by definition, not merged yet, so production does not have it and the check
# would fail — turning the guard red on exactly the schema PRs it exists to
# protect. It was run once against PR #666 to prove the secret and connection
# work from a runner (✅ 98 migrations), then removed.

# Two merges land close together: the second run's answer is the only one that
# matters, and cancelling the first avoids two jobs racing to report on the same
# database. Never cancel-in-progress on a deploy gate that MUTATES; this one is
# read-only, so cancelling costs nothing.
concurrency:
  group: prod-migrations
  cancel-in-progress: true

jobs:
  verify:
    name: Production has applied every migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg2
        run: pip install psycopg2-binary python-dotenv

      - name: Wait for Supabase Branching to apply, then verify
        env:
          # Session-mode pooler URL (port 5432). The pooler is IPv4-reachable;
          # the direct db.<ref>.supabase.co host is IPv6-only and will not
          # resolve from a GitHub-hosted runner.
          PROD_SUPABASE_DATABASE_URL: ${{ secrets.PROD_SUPABASE_DATABASE_URL }}
        # Branching applies migrations asynchronously after the merge, so an
        # instant check would false-alarm on every schema PR. Poll for 10
        # minutes; a real apply lands well inside that, and a failed one never
        # lands at all.
        run: python scripts/check_prod_migrations.py --wait 600

      # EMAIL, not a GitHub issue. An issue opened by github-actions[bot] notifies
      # nobody: GitHub's default "participating and @mentions" does not fire for a
      # bot-authored issue in your own repo, and the Issues tab is already used for
      # ordinary work, so the alert would arrive as silent noise. This sends to the
      # inbox, through Resend — the same channel the app's transactional mail
      # already uses, so it is a delivery path that is known to work.
      #
      # Never let a broken alerter mask the thing it is alerting about: every
      # failure path here exits 0, because the verify step above has ALREADY failed
      # the job. This step's only responsibility is telling someone.
      - name: Email the alert
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_EMAIL || 'debola31@gmail.com' }}
          ALERT_FROM: ${{ vars.ALERT_FROM_EMAIL || 'quotes@jigged.app' }}
        run: |
          set -uo pipefail

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::RESEND_API_KEY is not set — no email sent."
            echo "The job still fails; only the notification is missing."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:8}"

          # jq builds the JSON so the body can contain quotes, newlines and
          # backticks without hand-escaping into a broken payload.
          PAYLOAD=$(jq -n \
            --arg from "$ALERT_FROM" \
            --arg to "$ALERT_TO" \
            --arg subject "[Jigged] Production is behind main — migrations did not apply" \
            --arg sha "$SHORT_SHA" \
            --arg run "$RUN_URL" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              from: $from,
              to: [$to],
              subject: $subject,
              text: (
                "Production does not have every migration on main.\n\n" +
                "Commit: " + $sha + " (" + $repo + ")\n" +
                "Run:    " + $run + "\n\n" +
                "Supabase Branching applies migrations to production on merge. If they\n" +
                "are still pending, that apply failed or never ran, and the deployed\n" +
                "frontend may already be querying columns production does not have.\n\n" +
                "Migrations are atomic and ordered: read the FIRST pending version in\n" +
                "the run log. Everything after it is blocked behind it, not\n" +
                "independently broken.\n\n" +
                "See the real error:\n" +
                "    npx supabase@2.109.0 db push --linked --dry-run\n\n" +
                "Do NOT run `migration repair --status applied` to clear this. That\n" +
                "marks the file done without running it, so its contents never reach\n" +
                "production and the next migration depending on them fails the same way.\n"
              )
            }')

          HTTP=$(curl -sS -o /tmp/resend.out -w '%{http_code}' \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || true

          if [ "${HTTP:-000}" = "200" ]; then
            echo "Alert emailed to ${ALERT_TO}."
          else
            echo "::warning::Resend returned HTTP ${HTTP:-000} — alert email not delivered."
            cat /tmp/resend.out 2>/dev/null || true
          fi
          exit 0

      - name: Explain a failure in the run summary
        if: failure()
        run: |
          {
            echo "## Production is behind \`main\`"
            echo
            echo "Migrations on \`main\` have not been applied to the production"
            echo "database. Supabase Branching applies them on merge, so if they"
            echo "are still pending, that apply **failed or never ran**."
            echo
            echo "Migrations are atomic and ordered: the FIRST pending version in"
            echo "the log above is the one to read. Everything after it is blocked"
            echo "behind it, not independently broken."
            echo
            echo "See the real error with:"
            echo '```'
            echo "npx supabase@2.109.0 db push --linked --dry-run"
            echo '```'
            echo
            echo "Do **not** resolve this with \`migration repair --status applied\`."
            echo "That marks the migration done without running it, so its contents"
            echo "never reach production and the next migration to depend on them"
            echo "fails the same way."
          } >> "$GITHUB_STEP_SUMMARY"
