# One stable URL for the newest preview, whatever branch produced it.
#
# WHY: Intuit matches an OAuth redirect URI EXACTLY, and Vercel preview URLs carry
# a per-deployment hash. Every stable URL Vercel offers is branch-scoped, so the
# alternatives were re-registering a URI per branch, or keeping a long-lived
# branch alive purely to hold one — which would also hold a Supabase preview
# branch open indefinitely for nothing.
#
# So: register https://preview.jigged.app/api/quickbooks/callback with Intuit
# once, and repoint the domain at each new preview as it goes live.
#
# HOW, and why NOT `vercel alias set` — this is the correction that matters. A
# project domain with no gitBranch IS a production domain: Vercel documents that
# such a domain "will point to the most recent production deployment of that
# project by default", so it auto-reclaims the domain on every production deploy.
# `vercel alias set` therefore held only until the next merge to main, which is
# exactly what shipped first and was reported as the domain "showing production".
#
# Binding the domain to a BRANCH instead puts it in the Preview environment,
# where production cannot take it. Vercel's docs name the endpoint used here:
# "you can assign a domain to a Git branch programmatically using the Vercel REST
# API's 'Update a project domain' PATCH endpoint."
#
# The branch has to be looked up rather than read from the event: GitHub's
# deployment_status payload carries a full SHA in `ref` and an empty `payload`,
# so the branch name is simply not in it. Vercel's deployment object has it as
# meta.githubCommitRef.
#
# Verified by hand against the live project before this was written: PATCH set
# gitBranch, and `vercel alias ls` then showed preview.jigged.app resolving to
# that branch's newest preview deployment.
#
# QuickBooks DESKTOP needs none of this: it has no OAuth callback. This exists
# for QuickBooks Online, whose connect flow redirects back to us.

name: Preview Alias

# deployment_status is the only event whose payload carries the real preview URL
# (environment_url). The commit STATUS Vercel also posts points at the vercel.com
# dashboard, not at the site, so it cannot drive this.
#
# GitHub's docs say deployment_status workflows are read from the default branch
# only. That is NOT what happens here — this ran on its own PR branch, before it
# had ever been on main. Trust the Actions tab over either claim.
on: deployment_status

env:
  ALIAS_DOMAIN: preview.jigged.app

# Last one in wins, on purpose. When two previews finish together the domain
# should end up on the NEWER one, so an in-flight run is cancelled by the
# deployment that superseded it rather than racing it to the finish.
#
# The consequence to know: this domain is shared mutable state. If someone else's
# preview lands mid-test, an OAuth callback arrives at their build, not yours.
concurrency:
  group: preview-alias
  cancel-in-progress: true

# Both are for the SHA → branch fallback in the step below, which asks GitHub what
# branch a commit belongs to rather than trusting Vercel to report it:
# `contents: read` for branches-where-head, `pull-requests: read` for the
# commits/{sha}/pulls lookup that covers a commit the branch has moved past.
# Everything else here still only calls Vercel.
permissions:
  contents: read
  pull-requests: read

jobs:
  alias:
    # Production deployments own www.jigged.app and must never move this domain —
    # which is the whole point of binding it to a branch. `state` also filters out
    # the pending/failure/error statuses that fire for the same deployment.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point the preview domain at this branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The team ID, never its slug. The slug already changed once — on the
          # Pro upgrade, adebola-akeredolus-projects became psyco-ghost — which
          # silently invalidates every URL built from it. The ID does not move.
          VERCEL_SCOPE: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          # For the SHA → branch fallback. Both are read because the deployment
          # object populates them inconsistently: `sha` is the commit, and `ref` is
          # sometimes a branch name and sometimes the same full SHA. Whichever
          # resolves first wins, and a branch name works with this endpoint too.
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          GH_TOKEN: ${{ github.token }}
        # NEVER fails the run, deliberately. This is a convenience for QuickBooks
        # Online OAuth testing, not a correctness gate — and this job attaches to
        # the commit, so a hard failure paints a red X on every unrelated PR. A
        # check that is red for a reason nobody needs to act on is how people
        # learn to ignore red checks. The outcome goes to the step summary and a
        # warning annotation instead.
        #
        # The trade to know: green means the job ran, not that the domain moved.
        run: |
          set -uo pipefail
          API=https://api.vercel.com

          if [ -z "${TARGET_URL}" ]; then
            echo "::warning::deployment_status carried no environment_url; nothing to point."
            exit 0
          fi
          HOST="${TARGET_URL#https://}"; HOST="${HOST%%/*}"

          # ── Resolving the branch, the part that silently stopped working ──
          #
          # This used to be one line piping the Vercel deployment straight into
          # `jq -r '.meta.githubCommitRef // empty'`. That line cannot tell three
          # different situations apart, because all of them produce "": the field
          # is genuinely absent, the API returned an error object, or the token was
          # rejected outright. It reported all three as "no branch on deployment",
          # which reads like a harmless quirk of that deployment.
          #
          # It was not harmless. Between 2026-09-02 and 2026-09-04 every run took
          # that path, so preview.jigged.app stayed pinned to a stale branch while
          # three consecutive runs reported success — and because this domain is the
          # registered Intuit OAuth redirect, preview sign-ins were landing on the
          # wrong build the whole time. Nothing said so, since the job is
          # deliberately non-failing (see above) and the warning looks routine.
          #
          # So: check the HTTP status, name a token problem as a token problem, and
          # ask GITHUB for the branch when Vercel does not supply it. GitHub knows
          # the answer without any Vercel credential at all, which removes the
          # single point of failure rather than just reporting it better.
          BRANCH=""
          HTTP=$(curl -sS -o /tmp/vercel-deployment.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${API}/v13/deployments/${HOST}?teamId=${VERCEL_SCOPE}") || HTTP=000

          if [ "${HTTP}" = "200" ]; then
            BRANCH=$(jq -r '.meta.githubCommitRef // empty' /tmp/vercel-deployment.json)
          else
            # 401/403 here means VERCEL_TOKEN expired or lost scope, which also
            # dooms the PATCH below — worth naming rather than discovering twice.
            echo "::warning::Vercel deployment lookup returned HTTP ${HTTP} for ${HOST}. If 401/403, VERCEL_TOKEN has expired or lost scope; regenerate it and update the repository secret."
          fi

          # Fallback: ask GitHub which branch this commit belongs to.
          # `deployment_status` gives a SHA rather than a branch name, so this is
          # the lookup that was missing. TWO endpoints, in this order, because the
          # obvious one alone is not enough:
          #
          #   branches-where-head — exact, but matches only a commit that is STILL
          #     the branch tip. Two pushes in quick succession leave the first
          #     deployment's commit superseded before its alias job runs, and this
          #     then answers "none" for a branch that plainly exists. Measured on
          #     129c00e6 while adding this.
          #   commits/{sha}/pulls — answers for any commit in an open PR, which is
          #     exactly the case above and the case this workflow exists to serve.
          #
          # Neither needs a Vercel credential, which is the point: the branch is a
          # GitHub fact and asking Vercel for it added a dependency for nothing.
          if [ -z "${BRANCH}" ]; then
            for CANDIDATE in "${DEPLOY_SHA}" "${DEPLOY_REF}"; do
              [ -z "${CANDIDATE}" ] && continue
              BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE}/branches-where-head" \
                --jq '.[0].name // empty' 2>/dev/null) || BRANCH=""
              if [ -z "${BRANCH}" ]; then
                BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE}/pulls" \
                  --jq '.[0].head.ref // empty' 2>/dev/null) || BRANCH=""
              fi
              if [ -n "${BRANCH}" ]; then
                echo "Vercel reported no branch; GitHub resolved ${CANDIDATE:0:8} → ${BRANCH}."
                break
              fi
            done
          fi

          if [ -z "${BRANCH}" ]; then
            echo "::warning::Could not resolve a branch for ${HOST} from Vercel or GitHub. Leaving ${ALIAS_DOMAIN} where it is."
            echo "Preview domain unchanged — could not resolve a branch." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          PATCH_HTTP=$(curl -sS -X PATCH -o /tmp/vercel-patch.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/v9/projects/${VERCEL_PROJECT_ID}/domains/${ALIAS_DOMAIN}?teamId=${VERCEL_SCOPE}" \
            -d "$(jq -nc --arg b "${BRANCH}" '{gitBranch: $b}')") || PATCH_HTTP=000

          BOUND=$(jq -r '.gitBranch // empty' /tmp/vercel-patch.json 2>/dev/null || echo "")
          if [ "${BOUND}" = "${BRANCH}" ]; then
            echo "✅ ${ALIAS_DOMAIN} → ${BRANCH} (${HOST})"
            echo "${ALIAS_DOMAIN} → ${BRANCH} (${HOST})" >> "${GITHUB_STEP_SUMMARY}"
          else
            # Most likely cause is token scope: this writes PROJECT SETTINGS,
            # where the old `vercel alias set` only touched deployments. The HTTP
            # status is printed because 401/403 says "token", while 4xx with an
            # error body says "request" — and the old message conflated them.
            echo "::warning::Could not bind ${ALIAS_DOMAIN} to ${BRANCH} (HTTP ${PATCH_HTTP}). Vercel said: $(jq -c '.error // .' /tmp/vercel-patch.json 2>/dev/null | head -c 300)"
            {
              echo "Preview domain unchanged — PATCH returned HTTP ${PATCH_HTTP}."
              echo
              echo "If 401 or 403, regenerate \`VERCEL_TOKEN\` with project-settings"
              echo "scope and update the repository secret. Until this succeeds,"
              echo "${ALIAS_DOMAIN} keeps serving whatever branch it last bound —"
              echo "which is also the registered Intuit OAuth redirect."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
