name: Sync staging with main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and merge sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if staging is already up to date with main
          git fetch origin staging
          if git diff --quiet origin/main origin/staging; then
            echo "staging is already up to date with main"
            exit 0
          fi

          # Check for merge conflicts
          git checkout staging
          if ! git merge --no-commit --no-ff origin/main 2>/dev/null; then
            git merge --abort 2>/dev/null || true
            echo "::warning::Merge conflicts detected. Creating PR for manual resolution."
            # Create PR without merging
            EXISTING_PR=$(gh pr list --base staging --head main --json number --jq '.[0].number')
            if [ -z "$EXISTING_PR" ]; then
              gh pr create \
                --title "Sync staging with main (conflicts)" \
                --body "Automatic sync from main into staging. **Manual conflict resolution required.**" \
                --base staging \
                --head main
            else
              echo "PR #$EXISTING_PR already exists"
            fi
            exit 0
          fi
          git reset --hard origin/staging

          # No conflicts — create PR and merge immediately
          EXISTING_PR=$(gh pr list --base staging --head main --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --title "Sync staging with main" \
              --body "Automatic sync from main into staging." \
              --base staging \
              --head main)
            PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          else
            PR_NUMBER=$EXISTING_PR
            echo "PR #$PR_NUMBER already exists, merging"
          fi

          gh pr merge "$PR_NUMBER" --merge --delete-branch=false
