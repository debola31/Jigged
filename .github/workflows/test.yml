name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so the legal-docs freeze check can resolve the PR
          # base ref. With a shallow clone `git show <base>:public/legal/manifest.json`
          # fails, Tier 2 skips, and an edit to a published legal document would
          # sail through green — the one thing that check exists to stop.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        # `pnpm lint` runs `eslint --max-warnings <N>` per package.json (the
        # source of truth for the cap). The cap ratchets monotonically down
        # toward 0 as warnings are paid off (issue #442); never raise it.
        run: pnpm lint

      - name: Docs check — cited paths and link anchors resolve (issue #686)
        # Deliberately a NAMED step even though `pnpm test` below re-runs the
        # same spec. Two reasons: a doc-only PR fails here in seconds instead of
        # after the full suite, and the failure arrives as a step called "Docs
        # check" rather than one line inside a 2,000-test log — which is the
        # difference between a rot report someone reads and one they scroll past.
        # Driven through vitest, like the repo's other source scanners, so it
        # needs no runner beyond what is already installed.
        run: pnpm exec vitest run __tests__/standards/docLinkCheck.test.ts

      - name: Analytics check — captured events match the tracking plan (issue #702)
        # Named for the same reason as the docs check above: this fails on a PR
        # that adds a posthog.capture() without a row in docs/analytics-events.md,
        # and the author needs to see "Analytics check" rather than one assertion
        # buried in the full suite. Both directions are enforced — a stale row
        # describing an event nobody sends fails too, because a registry with one
        # wrong row stops being read.
        run: pnpm exec vitest run __tests__/standards/analyticsEvents.test.ts

      - name: Legal docs check — a shipped version's bytes and metadata are frozen
        # Named for the same reason as the two checks above. This one guards the
        # invariant the whole clickwrap feature rests on: every terms_acceptances
        # row stores a document_sha256, and that hash is only worth storing if the
        # exact bytes it names can still be produced years later. Editing a
        # published document in place invalidates every acceptance already recorded
        # against it, silently — nothing else in the stack notices.
        #
        # BASE_REF is passed in rather than discovered, so the check never depends
        # on whether a remote-tracking ref happens to be current. On a `push` (no
        # pull_request payload) it is empty, Tier 2 skips with a warning, and only
        # the on-disk hashes are verified — the freeze is a PR-time control, which
        # scripts/legalDocumentsCheck.ts states in its header.
        env:
          LEGAL_DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec vitest run __tests__/standards/legalDocuments.test.ts

      - name: Run tests with coverage (enforced thresholds in vitest.config.ts)
        run: pnpm test --run --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Pull the Supabase stack images (postgres, postgres-meta, gotrue, …) from
    # GitHub Container Registry instead of the CLI's default AWS public ECR.
    # Shared GitHub-runner IPs regularly trip public.ecr.aws's anonymous pull
    # rate limit ("toomanyrequests: Rate exceeded"), which flaked `supabase
    # start` at the postgres-meta pull. GHCR mirrors the identical images and is
    # effectively unmetered for public pulls from GitHub-hosted runners.
    # (docker.io mirrors them too but carries its own anonymous per-IP limit, so
    # it just trades one throttle for another.) See supabase/cli#419.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt -r ../worker/requirements.txt

      # Local Supabase via the CLI — replays supabase/migrations/ on a fresh
      # Postgres + Auth + Storage stack. Backend integration tests + RLS tests
      # talk to this localhost instance instead of staging or prod. Default
      # ports: API 54321, DB 54322.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`): resolving "latest" hits the releases API,
          # which flakes with a Gateway Time-out and isn't reproducible.
          # Keep in lockstep with e2e-tests.yml and the CLI devs use for
          # `pnpm gen:db-types` — the types-drift check below diffs a --local
          # regen, so a version skew would produce a spurious failure.
          version: 2.109.0

      - name: Start local Supabase
        working-directory: ./
        run: supabase start

      # `supabase gen types typescript --local` (the check below) starts its OWN
      # postgres-meta container and — unlike `supabase start` — does NOT honor
      # SUPABASE_INTERNAL_IMAGE_REGISTRY, so it pulls postgres-meta straight from
      # public.ecr.aws and re-flakes on the exact rate limit #579 fixed for the
      # stack. Pull the identical image from GHCR (unmetered from GH runners) and
      # tag it as the ECR ref the CLI looks for, so gen-types finds it locally and
      # never touches ECR. POSTGRES_META_VERSION tracks the pinned CLI (2.109.0) —
      # bump it in lockstep with the setup-cli version above if the CLI changes.
      - name: Pre-pull postgres-meta from GHCR (gen-types ignores the registry override)
        env:
          POSTGRES_META_VERSION: v0.96.1
        run: |
          docker pull "ghcr.io/supabase/postgres-meta:${POSTGRES_META_VERSION}"
          docker tag "ghcr.io/supabase/postgres-meta:${POSTGRES_META_VERSION}" \
            "public.ecr.aws/supabase/postgres-meta:${POSTGRES_META_VERSION}"

      - name: Verify generated DB types match migrations (issue #406)
        working-directory: ./
        # The local stack (started above) has replayed supabase/migrations/.
        # Regenerate types/database.ts from it and assert the committed file is
        # identical — catches a migration that changed the schema without a
        # `pnpm gen:db-types`, or a hand-edited types file (the class that let
        # PR #405 ship green). Pinned CLI + fixed config.toml make this a
        # deterministic, normalization-free diff: the --local generator emits
        # no volatile PostgrestVersion header.
        run: |
          supabase gen types typescript --local > types/database.ts
          if ! git diff --exit-code -- types/database.ts; then
            echo "::error::types/database.ts is out of sync with supabase/migrations/."
            echo "A migration changed the schema but the committed types were not"
            echo "regenerated (or types/database.ts was hand-edited). Fix with:"
            echo "    supabase start && pnpm gen:db-types"
            echo "then commit the updated types/database.ts."
            exit 1
          fi

      - name: Export prod-aligned env vars
        # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY.
        # We re-export under the TEST_*_KEY names that conftest.py reads.
        # PUBLISHABLE_KEY is required for the JWT fixtures added in 3c.
        working-directory: ./
        run: |
          eval "$(supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "TEST_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "TEST_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV

      - name: Run tests with enforced coverage floor
        # 65 = measured-current minus 5pp headroom (measured 70% on
        # 2026-05-27). Bump in lockstep with new backend tests, never as a
        # standalone "increase threshold" PR. Override via repo variable
        # `BACKEND_COV_FLOOR` if a sweeping change needs to ratchet without
        # a workflow edit.
        run: pytest -v --cov=. --cov-report=term --cov-report=xml --cov-fail-under=${{ vars.BACKEND_COV_FLOOR || '65' }}

      # The desktop worker lives outside api/, so api/pytest.ini's `testpaths =
      # tests` cannot see it and the step above runs none of its tests. Its PDF
      # ingestion stage is the only place in the product that opens a binary file
      # server-side, and the 4096px cap it enforces is arithmetic that silently
      # decides how legible a drawing is to the model -- exactly the thing that
      # must not go unasserted.
      - name: Run desktop worker tests
        working-directory: ./
        run: pytest worker/tests -v

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: api/coverage.xml

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        working-directory: ./
        run: supabase stop
