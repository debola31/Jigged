name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        # `pnpm lint` runs `eslint --max-warnings <N>` per package.json (the
        # source of truth for the cap). The cap ratchets monotonically down
        # toward 0 as warnings are paid off (issue #442); never raise it.
        run: pnpm lint

      - name: Run tests with coverage (enforced thresholds in vitest.config.ts)
        run: pnpm test --run --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Pull the Supabase stack images (postgres, postgres-meta, gotrue, …) from
    # GitHub Container Registry instead of the CLI's default AWS public ECR.
    # Shared GitHub-runner IPs regularly trip public.ecr.aws's anonymous pull
    # rate limit ("toomanyrequests: Rate exceeded"), which flaked `supabase
    # start` at the postgres-meta pull. GHCR mirrors the identical images and is
    # effectively unmetered for public pulls from GitHub-hosted runners.
    # (docker.io mirrors them too but carries its own anonymous per-IP limit, so
    # it just trades one throttle for another.) See supabase/cli#419.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # Local Supabase via the CLI — replays supabase/migrations/ on a fresh
      # Postgres + Auth + Storage stack. Backend integration tests + RLS tests
      # talk to this localhost instance instead of staging or prod. Default
      # ports: API 54321, DB 54322.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`): resolving "latest" hits the releases API,
          # which flakes with a Gateway Time-out and isn't reproducible.
          # Keep in lockstep with e2e-tests.yml and the CLI devs use for
          # `pnpm gen:db-types` — the types-drift check below diffs a --local
          # regen, so a version skew would produce a spurious failure.
          version: 2.109.0

      - name: Start local Supabase
        working-directory: ./
        run: supabase start

      - name: Verify generated DB types match migrations (issue #406)
        working-directory: ./
        # The local stack (started above) has replayed supabase/migrations/.
        # Regenerate types/database.ts from it and assert the committed file is
        # identical — catches a migration that changed the schema without a
        # `pnpm gen:db-types`, or a hand-edited types file (the class that let
        # PR #405 ship green). Pinned CLI + fixed config.toml make this a
        # deterministic, normalization-free diff: the --local generator emits
        # no volatile PostgrestVersion header.
        run: |
          supabase gen types typescript --local > types/database.ts
          if ! git diff --exit-code -- types/database.ts; then
            echo "::error::types/database.ts is out of sync with supabase/migrations/."
            echo "A migration changed the schema but the committed types were not"
            echo "regenerated (or types/database.ts was hand-edited). Fix with:"
            echo "    supabase start && pnpm gen:db-types"
            echo "then commit the updated types/database.ts."
            exit 1
          fi

      - name: Export prod-aligned env vars
        # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY.
        # We re-export under the TEST_*_KEY names that conftest.py reads.
        # PUBLISHABLE_KEY is required for the JWT fixtures added in 3c.
        working-directory: ./
        run: |
          eval "$(supabase status -o env)"
          echo "TEST_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "TEST_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "TEST_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV

      - name: Run tests with enforced coverage floor
        # 65 = measured-current minus 5pp headroom (measured 70% on
        # 2026-05-27). Bump in lockstep with new backend tests, never as a
        # standalone "increase threshold" PR. Override via repo variable
        # `BACKEND_COV_FLOOR` if a sweeping change needs to ratchet without
        # a workflow edit.
        run: pytest -v --cov=. --cov-report=term --cov-report=xml --cov-fail-under=${{ vars.BACKEND_COV_FLOOR || '65' }}

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: api/coverage.xml

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        working-directory: ./
        run: supabase stop
