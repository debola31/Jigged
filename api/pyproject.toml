# Per-subproject config for the FastAPI backend.
#
# The root project is npm-managed (Next.js); this file scopes Python tooling
# (currently just mutmut) to the api/ tree. New Python tools that need
# pyproject.toml config can be added here.

[tool.mutmut]
# Source paths to mutate. Mutation testing on routes/ surfaces FastAPI
# decorator and request-shape edge cases; services/ covers business logic;
# tools/ and utils/ cover the SQL allowlist + email helpers. AI provider
# wrappers and database/test fixtures are deliberately excluded.
paths_to_mutate = [
  "routes/",
  "services/",
  "tools/",
  "utils/",
]

# Where tests live. Unit subdir only — integration tests require
# TEST_SUPABASE_URL and would skew mutation runtime to hours per run.
# mutmut v3.5 has an argv-splitting bug on string values for this key;
# list form sidesteps it (issue tracked upstream).
tests_dir = ["tests/unit/"]

# Runner command — flags only, no positional test paths. mutmut v3 hands
# the test directory in via `tests_dir`; passing a path positionally here
# trips a v3 argv-splitting bug. `-x` fast-fails on the first failure
# (every failure means the mutant was killed). `-q` quiets the output so
# survivor lists are easy to scan. `-p no:cacheprovider` avoids pytest
# cache races mutmut sometimes triggers when parallelizing.
runner = "python -m pytest -x -q -p no:cacheprovider"
