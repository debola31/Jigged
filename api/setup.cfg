# Per-subproject Python config. Lives here (not in pyproject.toml) because
# Vercel auto-detects pyproject.toml as a uv project and runs `uv lock`,
# which fails on a `[tool.mutmut]`-only file (no `[project]` table).
# setup.cfg sidesteps that entirely.

[mutmut]
# Source paths to mutate. routes/ surfaces FastAPI request-shape edge cases;
# services/ covers business logic; tools/ covers the SQL allowlist; utils/
# covers shared helpers. AI provider wrappers and test fixtures are excluded.
paths_to_mutate = routes/,services/,tools/,utils/

# Tests directory. Unit subdir only — integration tests need TEST_SUPABASE_URL
# and would skew mutation runtime by orders of magnitude.
tests_dir = tests/unit/

# Runner command. `-x` fast-fails (every failure means the mutant was killed,
# so there's no point continuing). `-q` keeps survivor output scannable.
# The trailing `tests/unit` repeats the dir scope so mutmut doesn't fall
# back to pytest.ini's `testpaths = tests` (which would pull in the
# Supabase-requiring integration tests).
runner = python -m pytest -x -q tests/unit
