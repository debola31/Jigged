<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="980" height="520" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="2" stroke-opacity="0.35"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62828"/></marker></defs>
<text x="20" y="26" font-weight="bold" font-size="15">A. Along the knob: where the hand sits</text>
<rect x="160.0" y="40" width="48.0" height="450" fill="url(#h)" stroke="#c62828" stroke-width="1"/>
<text x="154.0" y="52" fill="#c62828" text-anchor="end">band the lever sweeps</text>
<text x="154.0" y="68" fill="#c62828" text-anchor="end">every turn (−10 to 6 mm)</text>
<rect x="160.0" y="115.0" width="48.0" height="80" fill="#9e9e9e" stroke="#424242"/>
<polyline points="160.0,195 172.0,201 184.0,191 196.0,201 208.0,195" fill="#ffffff" stroke="#424242"/>
<text x="154.0" y="175.0" fill="#333" text-anchor="end">lever, 120 mm</text>
<text x="154.0" y="191.0" fill="#333" text-anchor="end">to the screw</text>
<rect x="190.0" y="74.5" width="270.0" height="81.0" rx="6" fill="#cfd8dc" stroke="#424242"/>
<line x1="100.0" y1="115" x2="490.0" y2="115" stroke="#424242" stroke-dasharray="6 4"/>
<text x="325.0" y="99.0" text-anchor="middle" fill="#222">knob, 90 mm, spins freely</text>
<line x1="100.0" y1="230" x2="490.0" y2="230" stroke="#555"/>
<line x1="130.0" y1="226" x2="130.0" y2="234" stroke="#555"/>
<text x="130.0" y="248" text-anchor="middle" fill="#555">-20</text>
<line x1="190.0" y1="226" x2="190.0" y2="234" stroke="#555"/>
<text x="190.0" y="248" text-anchor="middle" fill="#555">0</text>
<line x1="250.0" y1="226" x2="250.0" y2="234" stroke="#555"/>
<text x="250.0" y="248" text-anchor="middle" fill="#555">20</text>
<line x1="310.0" y1="226" x2="310.0" y2="234" stroke="#555"/>
<text x="310.0" y="248" text-anchor="middle" fill="#555">40</text>
<line x1="370.0" y1="226" x2="370.0" y2="234" stroke="#555"/>
<text x="370.0" y="248" text-anchor="middle" fill="#555">60</text>
<line x1="430.0" y1="226" x2="430.0" y2="234" stroke="#555"/>
<text x="430.0" y="248" text-anchor="middle" fill="#555">80</text>
<line x1="490.0" y1="226" x2="490.0" y2="234" stroke="#555"/>
<text x="490.0" y="248" text-anchor="middle" fill="#555">100</text>
<text x="496.0" y="234" fill="#555">mm</text>
<text x="220.0" y="220" fill="#555">along the knob, from the lever&#8217;s centreline</text>
<text x="92.0" y="279" text-anchor="end" fill="#222">Index finger</text>
<rect x="130.0" y="264" width="165.0" height="9" rx="2" fill="#90a4ae"/>
<rect x="160.0" y="264" width="48.0" height="9" fill="#c62828"/>
<text x="496.0" y="273" font-size="11" fill="#c62828">before: 271 vertices in the band</text>
<rect x="205.0" y="276" width="111.0" height="9" rx="2" fill="#81c784"/>
<rect x="205.0" y="276" width="3.0" height="9" fill="#c62828"/>
<text x="496.0" y="285" font-size="11" fill="#c62828">after: 45 vertices in the band</text>
<text x="92.0" y="309" text-anchor="end" fill="#222">Middle finger</text>
<rect x="121.0" y="294" width="177.0" height="9" rx="2" fill="#90a4ae"/>
<rect x="160.0" y="294" width="48.0" height="9" fill="#c62828"/>
<text x="496.0" y="303" font-size="11" fill="#c62828">before: 369 vertices in the band</text>
<rect x="247.0" y="306" width="144.0" height="9" rx="2" fill="#81c784"/>
<text x="496.0" y="315" font-size="11" fill="#2e7d32">after: clear</text>
<text x="92.0" y="339" text-anchor="end" fill="#222">Ring finger</text>
<rect x="184.0" y="324" width="222.0" height="9" rx="2" fill="#90a4ae"/>
<rect x="184.0" y="324" width="24.0" height="9" fill="#c62828"/>
<text x="496.0" y="333" font-size="11" fill="#c62828">before: 62 vertices in the band</text>
<rect x="322.0" y="336" width="105.0" height="9" rx="2" fill="#81c784"/>
<text x="496.0" y="345" font-size="11" fill="#2e7d32">after: clear</text>
<text x="92.0" y="369" text-anchor="end" fill="#222">Little finger</text>
<rect x="229.0" y="354" width="198.0" height="9" rx="2" fill="#90a4ae"/>
<text x="496.0" y="363" font-size="11" fill="#2e7d32">before: clear</text>
<rect x="391.0" y="366" width="117.0" height="9" rx="2" fill="#81c784"/>
<text x="514.0" y="375" font-size="11" fill="#2e7d32">after: clear</text>
<text x="92.0" y="399" text-anchor="end" fill="#222">Thumb</text>
<rect x="217.0" y="384" width="117.0" height="9" rx="2" fill="#90a4ae"/>
<text x="496.0" y="393" font-size="11" fill="#2e7d32">before: clear</text>
<rect x="214.0" y="396" width="114.0" height="9" rx="2" fill="#81c784"/>
<text x="496.0" y="405" font-size="11" fill="#2e7d32">after: clear</text>
<text x="92.0" y="429" text-anchor="end" fill="#222">Knuckles, palm</text>
<rect x="133.0" y="414" width="339.0" height="9" rx="2" fill="#90a4ae"/>
<rect x="160.0" y="414" width="48.0" height="9" fill="#c62828"/>
<text x="496.0" y="423" font-size="11" fill="#c62828">before: 202 vertices in the band</text>
<rect x="208.0" y="426" width="363.0" height="9" rx="2" fill="#81c784"/>
<text x="577.0" y="435" font-size="11" fill="#c62828">after: 2 vertices in the band</text>
<line x1="210.0" y1="222" x2="210.0" y2="444" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="214.0" y="458" fill="#2e7d32">the whole hand belongs right of here</text>
<text x="690" y="26" font-weight="bold" font-size="15">B. Down the knob, as the fist sees it</text>
<circle cx="830" cy="210" r="120" fill="url(#h)" stroke="#c62828" stroke-dasharray="6 4"/>
<path d="M801.7,238.3 A40,40 0 1 0 790.2,213.5 L814.1,211.4 A16,16 0 1 1 818.7,221.3 Z" fill="#ffccbc" stroke="#bf360c"/>
<circle cx="830" cy="210" r="13.5" fill="#cfd8dc" stroke="#424242"/>
<line x1="830" y1="210" x2="723.1" y2="259.9" stroke="#616161" stroke-width="16" stroke-linecap="round"/>
<text x="670" y="302" fill="#333">before: the grip was kept clear</text>
<text x="670" y="318" fill="#333">of the lever at this angle only;</text>
<text x="670" y="334" fill="#2e7d32">after: of the whole circle</text>
<path d="M939.8,133.1 A134,134 0 0 1 906.9,319.8" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="830" y="68" text-anchor="middle" fill="#c62828">one turn: the lever passes every angle,</text>
<text x="830" y="84" text-anchor="middle" fill="#c62828">and so through the fingers' bases</text>
<text x="876" y="180" fill="#bf360c">fingers</text>
<text x="830" y="480" text-anchor="middle" fill="#555">The fist keeps its orientation while the knob</text>
<text x="830" y="496" text-anchor="middle" fill="#555">orbits the screw, so the lever turns round it.</text>
</svg>
