<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="820" height="470" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="2" stroke-opacity="0.35"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62828"/></marker></defs>
<text x="20" y="26" font-weight="bold" font-size="15">A. Along the knob: where the hand sits</text>
<rect x="160.0" y="40" width="48.0" height="400" fill="url(#h)" stroke="#c62828" stroke-width="1"/>
<text x="154.0" y="52" fill="#c62828" text-anchor="end">band the lever sweeps</text>
<text x="154.0" y="68" fill="#c62828" text-anchor="end">every turn (−10 to 6 mm)</text>
<rect x="160.0" y="115.0" width="48.0" height="80" fill="#9e9e9e" stroke="#424242"/>
<polyline points="160.0,195 172.0,201 184.0,191 196.0,201 208.0,195" fill="#ffffff" stroke="#424242"/>
<text x="154.0" y="175.0" fill="#333" text-anchor="end">lever, 120 mm</text>
<text x="154.0" y="191.0" fill="#333" text-anchor="end">to the screw</text>
<rect x="190.0" y="74.5" width="270.0" height="81.0" rx="6" fill="#cfd8dc" stroke="#424242"/>
<line x1="100.0" y1="115" x2="490.0" y2="115" stroke="#424242" stroke-dasharray="6 4"/>
<text x="325.0" y="99.0" text-anchor="middle" fill="#222">knob, 90 mm, spins freely</text>
<line x1="100.0" y1="230" x2="490.0" y2="230" stroke="#555"/>
<line x1="130.0" y1="226" x2="130.0" y2="234" stroke="#555"/>
<text x="130.0" y="248" text-anchor="middle" fill="#555">-20</text>
<line x1="190.0" y1="226" x2="190.0" y2="234" stroke="#555"/>
<text x="190.0" y="248" text-anchor="middle" fill="#555">0</text>
<line x1="250.0" y1="226" x2="250.0" y2="234" stroke="#555"/>
<text x="250.0" y="248" text-anchor="middle" fill="#555">20</text>
<line x1="310.0" y1="226" x2="310.0" y2="234" stroke="#555"/>
<text x="310.0" y="248" text-anchor="middle" fill="#555">40</text>
<line x1="370.0" y1="226" x2="370.0" y2="234" stroke="#555"/>
<text x="370.0" y="248" text-anchor="middle" fill="#555">60</text>
<line x1="430.0" y1="226" x2="430.0" y2="234" stroke="#555"/>
<text x="430.0" y="248" text-anchor="middle" fill="#555">80</text>
<line x1="490.0" y1="226" x2="490.0" y2="234" stroke="#555"/>
<text x="490.0" y="248" text-anchor="middle" fill="#555">100</text>
<text x="496.0" y="234" fill="#555">mm</text>
<text x="220.0" y="220" fill="#555">along the knob, from the lever&#8217;s centreline</text>
<text x="92.0" y="281" text-anchor="end" fill="#222">Index finger</text>
<rect x="136.0" y="270" width="156.0" height="14" rx="3" fill="#90a4ae"/>
<rect x="160.0" y="270" width="48.0" height="14" fill="#c62828"/>
<text x="298.0" y="281" fill="#c62828">265 skin vertices in the band</text>
<text x="92.0" y="305" text-anchor="end" fill="#222">Middle finger</text>
<rect x="121.0" y="294" width="174.0" height="14" rx="3" fill="#90a4ae"/>
<rect x="160.0" y="294" width="48.0" height="14" fill="#c62828"/>
<text x="301.0" y="305" fill="#c62828">346 skin vertices in the band</text>
<text x="92.0" y="329" text-anchor="end" fill="#222">Ring finger</text>
<rect x="184.0" y="318" width="222.0" height="14" rx="3" fill="#90a4ae"/>
<rect x="184.0" y="318" width="24.0" height="14" fill="#c62828"/>
<text x="412.0" y="329" fill="#c62828">62 skin vertices in the band</text>
<text x="92.0" y="353" text-anchor="end" fill="#222">Little finger</text>
<rect x="229.0" y="342" width="192.0" height="14" rx="3" fill="#90a4ae"/>
<text x="427.0" y="353" fill="#2e7d32">clear</text>
<text x="92.0" y="377" text-anchor="end" fill="#222">Thumb</text>
<rect x="226.0" y="366" width="108.0" height="14" rx="3" fill="#90a4ae"/>
<text x="340.0" y="377" fill="#2e7d32">clear</text>
<text x="92.0" y="401" text-anchor="end" fill="#222">Knuckles, palm</text>
<rect x="136.0" y="390" width="321.0" height="14" rx="3" fill="#90a4ae"/>
<rect x="160.0" y="390" width="48.0" height="14" fill="#c62828"/>
<text x="463.0" y="401" fill="#c62828">199 skin vertices in the band</text>
<line x1="210.0" y1="222" x2="210.0" y2="414" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="214.0" y="428" fill="#2e7d32">the whole hand belongs right of here</text>
<text x="530" y="26" font-weight="bold" font-size="15">B. Down the knob, as the fist sees it</text>
<circle cx="670" cy="210" r="120" fill="url(#h)" stroke="#c62828" stroke-dasharray="6 4"/>
<path d="M641.7,238.3 A40,40 0 1 0 630.2,213.5 L654.1,211.4 A16,16 0 1 1 658.7,221.3 Z" fill="#ffccbc" stroke="#bf360c"/>
<circle cx="670" cy="210" r="13.5" fill="#cfd8dc" stroke="#424242"/>
<line x1="670" y1="210" x2="563.1" y2="259.9" stroke="#616161" stroke-width="16" stroke-linecap="round"/>
<text x="520" y="302" fill="#333">the lever where the grip was</text>
<text x="520" y="318" fill="#333">solved: one angle, in the gap</text>
<path d="M779.8,133.1 A134,134 0 0 1 746.9,319.8" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="670" y="68" text-anchor="middle" fill="#c62828">one turn: the lever passes every angle,</text>
<text x="670" y="84" text-anchor="middle" fill="#c62828">and so through the fingers' bases</text>
<text x="716" y="180" fill="#bf360c">fingers</text>
<text x="670" y="430" text-anchor="middle" fill="#555">The fist keeps its orientation while the knob</text>
<text x="670" y="446" text-anchor="middle" fill="#555">orbits the screw, so the lever turns round it.</text>
</svg>
