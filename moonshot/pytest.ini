[pytest]
# Run from the repo root: pytest moonshot. pythonpath makes `import moonshot` resolve to this directory.
pythonpath = ..
testpaths = tests
addopts = -ra --strict-markers
markers =
    data_root: needs the data root (C:\jigged-data on the hub); skipped where it is absent, as in CI
    farm: heavy tier, run on the farm through the queue, never in CI
