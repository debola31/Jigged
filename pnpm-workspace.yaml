packages:
  - .

# ── Dependency overrides ────────────────────────────────────────────────────
# THIS BLOCK IS A MIRROR OF `pnpm.overrides` IN package.json, AND THE TWO MUST
# STAY IDENTICAL. It is not redundancy for its own sake:
#
#   pnpm 10 reads `pnpm.overrides` from package.json.
#   pnpm 11 reads `overrides` from THIS file and IGNORES package.json entirely,
#           printing only a warning.
#
# CI pins pnpm 10 (.github/workflows/test.yml) and local development is on 11,
# so a pin written in only one place is applied in only one environment. These
# are CVE pins -- dompurify, ws, qs, esbuild, tar, postcss, js-yaml and the rest
# -- and the failure is silent: pnpm 11 regenerates a lockfile with every
# override dropped, and `pnpm install --frozen-lockfile` on CI's pnpm 10 then
# rejects it. Both symptoms were observed on 2026-08-10.
#
# When CI and local converge on one pnpm major, delete the losing copy.
overrides:
  "minimatch@<3.1.3": ">=3.1.3"
  "minimatch@>=9.0.0 <9.0.6": ">=9.0.6"
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=2.0.0 <2.0.3": "^2.0.3"
  "brace-expansion@>=4.0.0 <5.0.7": ">=5.0.7"
  "fast-uri@<3.1.4": ">=3.1.4 <4.0.0"
  "flatted@<3.4.2": ">=3.4.2"
  "yaml@<1.10.3": ">=1.10.3"
  picomatch: ">=4.0.4"
  lodash: ">=4.18.1"
  "tar@<7.5.16": "^7.5.16"
  "js-yaml@<4.2.0": "^4.2.0"
  "@babel/core@<7.29.6": "^7.29.6"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0"
  "ajv@<6.14.0": ">=6.14.0"
  dompurify: ">=3.4.12"
  "sharp@<0.35.0": ">=0.35.0"
  "postcss@<8.5.10": ">=8.5.10"
  vite: "8.0.16"
  ws: ">=8.20.1"
  qs: ">=6.15.2"
  esbuild: ">=0.28.1"
  "@opentelemetry/core": ">=2.8.0"

# ── Native build approval ───────────────────────────────────────────────────
# `allowBuilds` (pnpm 11) and `ignoredBuiltDependencies` (pnpm 10) express the
# same decision for two pnpm majors, and they MUST agree — otherwise a native
# dependency builds in one environment and not the other. sharp and
# unrs-resolver stay unbuilt in both.
allowBuilds:
  '@sentry/cli': true
  core-js: true
  msw: true
  sharp: false
  supabase: true
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
